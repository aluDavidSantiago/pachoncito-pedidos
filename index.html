<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pachoncito | Pedidos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="1.png" alt="Pachoncito" class="brand-logo">
            </div>
            <div class="badge">Reservas de Lunes a Viernes | Entregas los domingos</div>
        </header>

        <form id="orderForm">
            <div class="section-delivery">
                <label for="nombre">Nombre y Apellidos</label>
                <input type="text" id="nombre" required placeholder="Tu nombre completo">
            </div>

            <div class="section-delivery">
                <label for="telefono">Telefono de Contacto</label>
                <input type="tel" id="telefono" required placeholder="+34 600 000 000">
            </div>

            <div class="products-section">
                <div class="product-card">
                    <div class="product-info">
                        <h3>Clásico</h3>
                        <span class="price">1.50 €</span>
                    </div>
                    <div class="counter">
                        <button type="button" onclick="changeQty('clasico', -1)">-</button>
                        <input type="number" id="clasico" value="0" min="0" readonly>
                        <button type="button" onclick="changeQty('clasico', 1)">+</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-info">
                        <h3>Con Bocadillo (Guayaba)</h3>
                        <span class="price">1.70 €</span>
                    </div>
                    <div class="counter">
                        <button type="button" onclick="changeQty('bocadillo', -1)">-</button>
                        <input type="number" id="bocadillo" value="0" min="0" readonly>
                        <button type="button" onclick="changeQty('bocadillo', 1)">+</button>
                    </div>
                </div>

            <div id="napaAlert" class="alert-box">
                Añade mas productos para activar la bonificacion.
            </div>

            <div class="section-delivery">
                <label for="tipoEntrega">Metodo de Entrega</label>
                <select id="tipoEntrega" onchange="toggleDireccion()">
                    <option value="recogida">Recogida en Obrador (Premià de Mar)</option>
                    <option value="domicilio">Envio a Domicilio (+1.00 EUR)</option>
                </select>
            </div>

            <div class="section-delivery" id="direccionBox" style="display: none;">
                <label for="direccion">Direccion de Entrega</label>
                <input type="text" id="direccion" placeholder="Calle, numero, piso...">
            </div>

            <div class="section-delivery">
                <label for="hora">Franja Horaria</label>
                <select id="hora" required class="placeholder-select">
                    <option value="" disabled selected>Selecciona una franja horaria</option>
                    <option value="06:00 - 07:30">06:00 - 07:30</option>
                    <option value="07:30 - 09:00">07:30 - 09:00</option>
                    <option value="09:00 - 10:30">09:00 - 10:30</option>
                    <option value="10:30 - 12:00">10:30 - 12:00</option>
                    <option value="12:00 - 13:30">12:00 - 13:30</option>
                    <option value="13:30 - 15:00">13:30 - 15:00</option>
                    <option value="15:00 - 16:30">15:00 - 16:30</option>
                    <option value="16:30 - 18:00">16:30 - 18:00</option>
                </select>
            </div>

            <div class="summary">
                <h3>Total a Pagar: <span id="totalPrice">0.00</span> EUR</h3>
                <button type="submit" class="btn-primary">Reservar Pedido</button>
            </div>
        </form>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
